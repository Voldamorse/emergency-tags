<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Emergency Contact Profile</title>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #f5a623;
            --bg-playful: #f0f8ff;
            --text-dark: #333333;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-playful);
            color: var(--text-dark);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 450px; margin: 40px auto; }
        .profile-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-top: 8px solid var(--primary);
            text-align: center;
        }
        .photo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            border: 4px solid var(--primary);
            background: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .photo-container img { width: 100%; height: 100%; object-fit: cover; }
        .hidden { display: none !important; }
        h1.child-name { margin: 0 0 25px 0; color: #222; font-size: 2rem; }
        .info-group {
            text-align: left;
            margin-bottom: 20px;
            background: #fafafa;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid var(--secondary);
        }
        .label {
            font-weight: bold;
            color: #666;
            font-size: 0.85rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
        }
        .value { font-size: 1.2rem; color: #111; }
        .btn-call {
            display: block;
            width: 100%;
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 25px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <div class="photo-container hidden" id="photoFrame">
                <img id="childPhoto" src="" alt="Child Profile Picture">
            </div>
            <h1 class="child-name" id="childName">Emergency Profile</h1>
            <div class="info-group">
                <span class="label">Emergency Contact</span>
                <span class="value" id="parentName">—</span>
            </div>
            <div class="info-group">
                <span class="label">Telephone Number</span>
                <span class="value" id="phoneNumber">—</span>
            </div>
            <a href="#" class="btn-call" id="callButton">📞 Call Parent Instantly</a>
        </div>
    </div>
    <script>
        function getUrlParameters() {
            const params = {};
            const search = window.location.search.substring(1);
            if (!search) return params;
            const pairs = search.split("&");
            for (let i = 0; i < pairs.length; i++) {
                const pair = pairs[i].split("=");
                params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1].replace(/\+/g, ' '));
            }
            return params;
        }
        window.onload = function() {
            const data = getUrlParameters();
            document.getElementById('childName').innerText = data.n || "Emergency Profile";
            document.getElementById('parentName').innerText = data.p || "Not Provided";
            document.getElementById('phoneNumber').innerText = data.t || "Not Provided";
            if (data.t) {
                const cleanPhone = data.t.replace(/[^0-9+]/g, '');
                document.getElementById('callButton').href = "tel:" + cleanPhone;
            } else {
                document.getElementById('callButton').classList.add('hidden');
            }
            if (data.img) {
                const imgElement = document.getElementById('childPhoto');
                imgElement.src = data.img;
                imgElement.onload = function() {
                    document.getElementById('photoFrame').classList.remove('hidden');
                };
            }
        };
    </script>
</body>
</html>
