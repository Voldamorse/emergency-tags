<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie Library</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #141414; /* Dark layout theme */
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #E50914; /* Streaming red accent */
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .stream-btn {
            display: inline-block;
            background-color: #E50914;
            color: white;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 My Movie Library</h1>
        <p>Tap below to instantly stream your movie collection directly from Google Drive.</p>
        
        <!-- Opens your folder directly in a clean streaming player layout -->
        <a href="https://google.com" class="stream-btn">
            ▶ Open Library Player
        </a>
    </div>

</body>
</html>
